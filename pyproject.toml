[project]
name = "spam-filter"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
authors = [
    { name = "Mohamed Aassou", email = "mohamedaassou12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
start = "spam_filter:main"
train = "spam_filter.modeling.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
